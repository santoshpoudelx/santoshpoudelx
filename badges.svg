<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Badges: Full-Stack, SaaS, Discord Bots, Web3, Nepal" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141a3d"/>
    </linearGradient>
    <polygon id="hex" points="0,-64 55.4,-32 55.4,32 0,64 -55.4,32 -55.4,-32"/>
  </defs>

  <rect x="1" y="1" width="998" height="228" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- 1: Full-Stack -->
  <g transform="translate(100 105)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/>
      <use href="#hex" fill="#00f5d4" fill-opacity="0.08" stroke="#00f5d4" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </use>
      <text y="9" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="28" font-weight="700" fill="#00f5d4">&lt;/&gt;</text>
    </g>
    <text y="104" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Full-Stack</text>
  </g>

  <!-- 2: SaaS -->
  <g transform="translate(300 105)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4.6s" repeatCount="indefinite"/>
      <use href="#hex" fill="#9b5de5" fill-opacity="0.08" stroke="#9b5de5" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/>
      </use>
      <text y="10" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#9b5de5">SaaS</text>
    </g>
    <text y="104" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Product Builder</text>
  </g>

  <!-- 3: Discord bots -->
  <g transform="translate(500 105)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
      <use href="#hex" fill="#5865f2" fill-opacity="0.1" stroke="#5865f2" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/>
      </use>
      <text y="10" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="30" font-weight="700" fill="#7983f5">BOT</text>
    </g>
    <text y="104" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Discord Bots</text>
  </g>

  <!-- 4: Web3 -->
  <g transform="translate(700 105)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4.3s" repeatCount="indefinite"/>
      <use href="#hex" fill="#f15bb5" fill-opacity="0.08" stroke="#f15bb5" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
      </use>
      <text y="10" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="30" font-weight="700" fill="#f15bb5">0x</text>
    </g>
    <text y="104" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Web3 Learner</text>
  </g>

  <!-- 5: Nepal -->
  <g transform="translate(900 105)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4.8s" repeatCount="indefinite"/>
      <use href="#hex" fill="#fee440" fill-opacity="0.07" stroke="#fee440" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/>
      </use>
      <text y="10" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fee440">NP</text>
    </g>
    <text y="104" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">From Nepal</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
