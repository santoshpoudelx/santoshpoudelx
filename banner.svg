<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Santosh Poudel - Full-Stack Developer. SaaS, Discord bots, Web3." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#8b7bff"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1200" height="340" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base -->
    <rect width="1200" height="340" fill="#0a0d14"/>
    <rect width="1200" height="340" fill="url(#dots)"/>

    <!-- Slow drifting light -->
    <circle r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="980;880;980" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;120;40" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="240" fill="url(#glowB)">
      <animate attributeName="cx" values="120;240;120" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="320;250;320" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- LEFT: intro -->
    <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
      <!-- eyebrow -->
      <circle cx="74" cy="92" r="5" fill="#00f5d4">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="97" font-size="14" font-weight="600" letter-spacing="3" fill="#00f5d4">FULL-STACK DEVELOPER</text>

      <!-- name -->
      <text x="70" y="178" font-size="70" font-weight="800" letter-spacing="-1.5" fill="#f5f7ff">Santosh
        <tspan fill="url(#accent)">Poudel</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.1s" fill="freeze"/>
      </text>

      <!-- tagline -->
      <text x="72" y="224" font-size="22" fill="#9aa4bf">I build SaaS products and Discord bots.</text>

      <!-- pills -->
      <g font-size="14" font-weight="600" text-anchor="middle">
        <rect x="72" y="252" width="78" height="34" rx="17" fill="#00f5d4" fill-opacity="0.1" stroke="#00f5d4" stroke-opacity="0.45"/>
        <text x="111" y="274" fill="#00f5d4">SaaS</text>

        <rect x="162" y="252" width="128" height="34" rx="17" fill="#8b7bff" fill-opacity="0.12" stroke="#8b7bff" stroke-opacity="0.5"/>
        <text x="226" y="274" fill="#b4a9ff">Discord Bots</text>

        <rect x="302" y="252" width="86" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.25"/>
        <text x="345" y="274" fill="#d5dbf0">Web3</text>

        <rect x="400" y="252" width="86" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.25"/>
        <text x="443" y="274" fill="#d5dbf0">Nepal</text>
      </g>
    </g>

    <!-- RIGHT: code window -->
    <g>
      <rect x="650" y="48" width="500" height="244" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
      <!-- title bar -->
      <circle cx="676" cy="74" r="6" fill="#ff5f56"/>
      <circle cx="696" cy="74" r="6" fill="#ffbd2e"/>
      <circle cx="716" cy="74" r="6" fill="#27c93f"/>
      <text x="1126" y="79" text-anchor="end" font-family="'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#6b7592">profile.ts</text>
      <line x1="650" y1="94" x2="1150" y2="94" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- code, looping line-by-line reveal -->
      <g font-family="'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="15" xml:space="preserve">
        <text x="676" y="128" fill="#d5dbf0" opacity="0"><tspan fill="#ff7ab2">const</tspan> dev <tspan fill="#ff7ab2">=</tspan> {
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.07;0.92;1" dur="11s" repeatCount="indefinite"/>
        </text>
        <text x="696" y="154" fill="#d5dbf0" opacity="0">role: <tspan fill="#a5f3c8">"Full-Stack"</tspan>,
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.17;0.92;1" dur="11s" repeatCount="indefinite"/>
        </text>
        <text x="696" y="180" fill="#d5dbf0" opacity="0">building: [<tspan fill="#a5f3c8">"SaaS"</tspan>, <tspan fill="#a5f3c8">"DexBotX"</tspan>],
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.27;0.92;1" dur="11s" repeatCount="indefinite"/>
        </text>
        <text x="696" y="206" fill="#d5dbf0" opacity="0">learning: [<tspan fill="#a5f3c8">"Ethereum"</tspan>, <tspan fill="#a5f3c8">"Sui"</tspan>, <tspan fill="#a5f3c8">"Solana"</tspan>],
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.37;0.92;1" dur="11s" repeatCount="indefinite"/>
        </text>
        <text x="696" y="232" fill="#d5dbf0" opacity="0">location: <tspan fill="#a5f3c8">"Nepal"</tspan>,
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.47;0.92;1" dur="11s" repeatCount="indefinite"/>
        </text>
        <text x="676" y="258" fill="#d5dbf0" opacity="0">};
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.57;0.92;1" dur="11s" repeatCount="indefinite"/>
        </text>
      </g>

      <!-- blinking cursor -->
      <rect x="696" y="244" width="9" height="18" fill="#00f5d4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Thin accent edge -->
    <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
