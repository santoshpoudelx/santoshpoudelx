<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Santosh Poudel - Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="50%" stop-color="#141a3d"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#9b5de5;#f15bb5;#00f5d4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9b5de5">
        <animate attributeName="stop-color" values="#9b5de5;#f15bb5;#00f5d4;#9b5de5" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#9b5de5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9b5de5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC">
      <stop offset="0%" stop-color="#f15bb5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f15bb5" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="round">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- Drifting glow orbs -->
    <circle r="220" fill="url(#orbA)">
      <animate attributeName="cx" values="150;380;150" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;240;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="260" fill="url(#orbB)">
      <animate attributeName="cx" values="1000;760;1000" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;260;60" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="200" fill="url(#orbC)">
      <animate attributeName="cx" values="600;820;600" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;200;300" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating code symbols -->
    <g font-family="'Courier New', Consolas, monospace" font-weight="700" fill="#ffffff">
      <text x="90" y="260" font-size="34" opacity="0.18">&lt;/&gt;
        <animate attributeName="y" values="260;230;260" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="230" y="70" font-size="28" opacity="0.15">{ }
        <animate attributeName="y" values="70;95;70" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="1050" y="260" font-size="30" opacity="0.18">0x
        <animate attributeName="y" values="260;232;260" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="940" y="75" font-size="26" opacity="0.15">=&gt;
        <animate attributeName="y" values="75;100;75" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="1120" y="140" font-size="34" opacity="0.15">#
        <animate attributeName="y" values="140;115;140" dur="6.5s" repeatCount="indefinite"/>
      </text>
      <text x="40" y="150" font-size="26" opacity="0.14">;
        <animate attributeName="y" values="150;175;150" dur="7.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Pulsing terminal chip -->
    <g font-family="'Courier New', Consolas, monospace" font-size="16">
      <rect x="480" y="52" width="240" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent)" stroke-width="1.5"/>
      <circle cx="504" cy="69" r="5" fill="#00f5d4">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="520" y="74" fill="#c9d1ff">available for work</text>
    </g>

    <!-- Name -->
    <text x="600" y="162" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#accent)" filter="url(#glow)" opacity="0">
      Santosh Poudel
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" dur="1.2s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- Animated underline -->
    <line x1="330" y1="188" x2="870" y2="188" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540">
      <animate attributeName="stroke-dashoffset" from="540" to="0" dur="1.4s" begin="0.9s" fill="freeze"/>
    </line>

    <!-- Subtitle -->
    <text x="600" y="232" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="24" fill="#c9d1ff" opacity="0">
      Full-Stack Developer  •  SaaS  •  Discord Bots  •  Web3
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.6s" fill="freeze"/>
    </text>

    <text x="600" y="272" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="17" fill="#8b93c9" opacity="0">
      Ethereum  |  Sui  |  Solana    -    Nepal
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.1s" fill="freeze"/>
    </text>

    <!-- Border -->
    <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
